name: App CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'api/src/modules/leagues/crests.ts'
      - '.github/workflows/app-ci.yml'
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'api/src/modules/leagues/crests.ts'
      - '.github/workflows/app-ci.yml'

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      # Actions are pinned to full commit SHAs so a moved or compromised tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
